# Builds Chordfinder for Windows, macOS and Linux.
#
# - Push a tag like v0.2.0 -> builds all three and creates a *draft* GitHub
#   Release with the files attached (publish it by hand once you've checked it).
#   The tag must match "version" in tauri.conf.json.
# - "Run workflow" on the Actions tab -> builds all three; the files appear as
#   downloadable artifacts on the run page, no release is made.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Check tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            bundle-dir: target/release/bundle
          - name: macos
            os: macos-latest
            bundles: app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle-dir: target/universal-apple-darwin/release/bundle
          - name: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            bundle-dir: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build
        shell: bash
        run: npx --yes @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Collect files
        shell: bash
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          mkdir out
          case "${{ matrix.name }}" in
            windows)
              cp "${{ matrix.bundle-dir }}"/nsis/*.exe out/
              # Portable build: just the exe, no installer.
              mkdir portable
              cp target/release/chordfinder.exe LICENSE portable/
              pwsh -Command "Compress-Archive -Path portable/* -DestinationPath out/Chordfinder_${version}_x64-portable.zip"
              ;;
            macos)
              cp "${{ matrix.bundle-dir }}"/dmg/*.dmg out/
              ;;
            linux)
              cp "${{ matrix.bundle-dir }}"/appimage/*.AppImage out/
              cp "${{ matrix.bundle-dir }}"/deb/*.deb out/
              ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: chordfinder-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: files/*
